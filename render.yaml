# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
services:
  # Classroom app + API + WebSocket (React build served by Express)
  - type: web
    name: echoclass-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false            # paste your MongoDB Atlas connection string in Render dashboard
      - key: ALLOW_OPEN_TEACHER_SIGNUP
        value: "true"
      - key: PUBLIC_URL
        sync: false            # e.g. https://echoclass-ai.onrender.com (RENDER_EXTERNAL_URL is used if empty)
